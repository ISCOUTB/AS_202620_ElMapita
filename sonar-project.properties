sonar.organization=isco-utb
sonar.projectKey=ISCOUTB_AS_202620_ElMapita
sonar.projectName=AS_202620_ElMapita

# Fuentes: backend NestJS y frontend Flutter
sonar.sources=backend/src,frontend/lib
sonar.tests=backend/test,backend/src,frontend/test
sonar.test.inclusions=**/*.spec.ts,**/*-spec.ts,**/*_test.dart
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.g.dart,**/*.freezed.dart

# Cobertura (lcov) generada por jest y flutter test
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.dart.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/*.module.ts,backend/scripts/**

sonar.sourceEncoding=UTF-8
