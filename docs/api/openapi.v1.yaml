openapi: 3.1.0

info:
  title: El Mapita UTB — API
  version: 1.0.0
  description: |
    Contrato REST de la API de El Mapita UTB (backend NestJS, DEC-06/DEC-07).

    Esta es la **fuente de verdad** del contrato de integración entre el
    frontend Flutter y el backend NestJS. El backend se verifica contra
    este archivo en el pipeline (job `contract`, ver `.github/workflows/ci.yml`);
    no al revés.

    ## Reglas de versionado

    - **MAJOR** (cambio incompatible: se quita/renombra un campo o ruta,
      cambia un tipo, se endurece una validación) → nuevo archivo
      `openapi.v2.yaml` + nuevo prefijo de ruta `/api/v2`, con una ventana
      de convivencia entre `v1` y `v2` documentada en el ADR que la origine.
    - **MINOR** (campo u operación nueva, opcional y aditiva) → incrementa
      `info.version` a `1.x.0`.
    - **PATCH** (aclaración de descripción, ejemplo, `summary`) → incrementa
      `info.version` a `1.0.x`.

    Ver justificación de la estrategia (OpenAPI vs AsyncAPI) en
    [`docs/adr/0003-contrato-openapi-versionado.md`](../adr/0003-contrato-openapi-versionado.md).
  contact:
    name: Equipo El Mapita UTB

servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://api.elmapita-utb.example
    description: Producción (placeholder — pendiente de dominio real)

tags:
  - name: Health
  - name: Autenticación
  - name: Mapas
  - name: POIs
  - name: Ubicación

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check endpoint
      security: []
      responses:
        '200':
          description: Servicio saludable o degradado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/auth/signin:
    post:
      tags: [Autenticación]
      operationId: signIn
      summary: Iniciar sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInInput'
      responses:
        '200':
          description: Usuario autenticado con tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOutput'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/signup:
    post:
      tags: [Autenticación]
      operationId: signUp
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpInput'
      responses:
        '201':
          description: Usuario registrado con tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpOutput'
        '400':
          description: Datos inválidos o email ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refreshToken
      summary: Refrescar access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Nuevos tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenOutput'
        '401':
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/signout:
    post:
      tags: [Autenticación]
      operationId: signOut
      summary: Cerrar sesión
      responses:
        '200':
          description: Sesión cerrada

  /api/v1/auth/me:
    get:
      tags: [Autenticación]
      operationId: getCurrentUser
      summary: Obtener usuario actual
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentUserOutput'
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/users/{userId}/role:
    post:
      tags: [Autenticación]
      operationId: updateUserRole
      summary: Actualizar rol de usuario (solo admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleInput'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/map/buildings:
    get:
      tags: [Mapas]
      operationId: listBuildings
      summary: Listar todos los edificios del campus
      security: []
      responses:
        '200':
          description: Lista de edificios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuildingsOutput'

  /api/v1/map/buildings/{buildingId}:
    get:
      tags: [Mapas]
      operationId: getBuilding
      summary: Obtener detalle de un edificio con sus pisos y modelo 3D
      security: []
      parameters:
        - name: buildingId
          in: path
          required: true
          description: UUID del edificio
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Edificio con pisos y URL de modelo 3D
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuildingOutput'
        '404':
          description: Edificio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/map/floors/{floorId}/model:
    get:
      tags: [Mapas]
      operationId: getFloorModel
      summary: Obtener URL firmada del modelo 3D de un piso
      security: []
      parameters:
        - name: floorId
          in: path
          required: true
          description: UUID del piso
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Piso con URL de modelo 3D
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFloorModelOutput'
        '404':
          description: Piso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/pois/{poiId}:
    get:
      tags: [POIs]
      operationId: getPoi
      summary: Obtener POI por ID
      security: []
      parameters:
        - name: poiId
          in: path
          required: true
          description: UUID del POI
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: POI encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPoiOutput'
        '404':
          description: POI no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/pois/floor/{floorId}:
    get:
      tags: [POIs]
      operationId: listPoisByFloor
      summary: Listar POIs de un piso
      security: []
      parameters:
        - name: floorId
          in: path
          required: true
          description: UUID del piso
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de POIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPoisByFloorOutput'

  /api/v1/pois:
    post:
      tags: [POIs]
      operationId: createPoi
      summary: Crear nuevo POI (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoiInput'
      responses:
        '201':
          description: POI creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePoiOutput'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/location/current:
    get:
      tags: [Ubicación]
      operationId: getCurrentLocation
      summary: Obtener ubicación actual del usuario
      security: []
      responses:
        '200':
          description: Ubicación con precisión y fuente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentLocationOutput'

  /api/v1/location/manual:
    post:
      tags: [Ubicación]
      operationId: setManualLocation
      summary: Establecer ubicación manualmente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetManualLocationInput'
      responses:
        '200':
          description: Ubicación manual establecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetManualLocationOutput'

  /api/v1/location/permission/request:
    post:
      tags: [Ubicación]
      operationId: requestLocationPermission
      summary: Solicitar permiso de ubicación
      security: []
      responses:
        '200':
          description: Resultado de la solicitud de permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLocationPermissionOutput'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          required: [supabase]
          properties:
            supabase:
              type: string
              enum: [ok, degraded, down, unknown]

    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string

    GeoPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2

    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2

    Building:
      type: object
      required: [id, nombre, codigo, geometria, pisos, versionModelo3D, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        codigo:
          type: string
        geometria:
          $ref: '#/components/schemas/GeoPolygon'
        pisos:
          type: array
          items:
            type: string
            format: uuid
        versionModelo3D:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Floor:
      type: object
      required: [id, edificioId, numero, nombre, modelo3DUrl, modelo3DVersion, alturaMetros, pois, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        edificioId:
          type: string
          format: uuid
        numero:
          type: integer
        nombre:
          type: string
        modelo3DUrl:
          type: string
        modelo3DVersion:
          type: string
        alturaMetros:
          type: number
        pois:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListBuildingsOutput:
      type: object
      required: [buildings]
      properties:
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/Building'

    GetBuildingOutput:
      type: object
      required: [building, floors, model3DUrl]
      properties:
        building:
          $ref: '#/components/schemas/Building'
        floors:
          type: array
          items:
            $ref: '#/components/schemas/Floor'
        model3DUrl:
          type: string

    GetFloorModelOutput:
      type: object
      required: [floor, model3DUrl]
      properties:
        floor:
          $ref: '#/components/schemas/Floor'
        model3DUrl:
          type: string

    PoiType:
      type: string
      enum: [salon, laboratorio, bano, cafeteria, biblioteca, escalera, ascensor, otro]

    PoiMetadatos:
      type: object
      properties:
        capacidad:
          type: integer
        horario:
          type: string
        accesibilidad:
          type: boolean
        descripcion:
          type: string
      additionalProperties: true

    Poi:
      type: object
      required: [id, pisoId, tipo, nombre, geometria, metadatos, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        pisoId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/PoiType'
        nombre:
          type: string
        geometria:
          $ref: '#/components/schemas/GeoPoint'
        metadatos:
          $ref: '#/components/schemas/PoiMetadatos'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GetPoiOutput:
      type: object
      required: [poi]
      properties:
        poi:
          $ref: '#/components/schemas/Poi'

    ListPoisByFloorOutput:
      type: object
      required: [pois]
      properties:
        pois:
          type: array
          items:
            $ref: '#/components/schemas/Poi'

    CreatePoiInput:
      type: object
      required: [pisoId, tipo, nombre, geometria, metadatos]
      properties:
        pisoId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/PoiType'
        nombre:
          type: string
        geometria:
          $ref: '#/components/schemas/GeoPoint'
        metadatos:
          $ref: '#/components/schemas/PoiMetadatos'

    CreatePoiOutput:
      type: object
      required: [poi]
      properties:
        poi:
          $ref: '#/components/schemas/Poi'

    UserRole:
      type: string
      enum: [estudiante, visitante, docente, admin_staff, admin_utb]

    User:
      type: object
      required: [id, email, role, nombre, activo, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        nombre:
          type: string
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    SignInInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SignInOutput:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    SignUpInput:
      type: object
      required: [email, password, nombre]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nombre:
          type: string

    SignUpOutput:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshTokenOutput:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    GetCurrentUserOutput:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    UpdateUserRoleInput:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'

    LocationSource:
      type: string
      enum: [gps, wifi, ble, manual]

    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number

    UserLocation:
      type: object
      required: [coordinates, precisionMeters, source, timestamp, uncertaintyShown]
      properties:
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        precisionMeters:
          type: number
        floorEstimate:
          type: integer
        source:
          $ref: '#/components/schemas/LocationSource'
        timestamp:
          type: string
          format: date-time
        uncertaintyShown:
          type: boolean

    GetCurrentLocationOutput:
      type: object
      required: [location]
      properties:
        location:
          $ref: '#/components/schemas/UserLocation'

    SetManualLocationInput:
      type: object
      required: [buildingId, floor, x, y]
      properties:
        buildingId:
          type: string
          format: uuid
        floor:
          type: integer
        x:
          type: number
        y:
          type: number

    SetManualLocationOutput:
      type: object
      required: [location]
      properties:
        location:
          $ref: '#/components/schemas/UserLocation'

    RequestLocationPermissionOutput:
      type: object
      required: [granted]
      properties:
        granted:
          type: boolean
